name: Update upstream specifications

on:
  workflow_dispatch:
  schedule:
    - cron: '23 5 * * *'

permissions:
  contents: write
  pull-requests: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 9.0.x
      - name: Download specifications
        id: specifications
        shell: pwsh
        run: |
          ./scripts/Update-Specifications.ps1
          $changed = -not (git diff --quiet -- specs)
          "changed=$($changed.ToString().ToLowerInvariant())" >> $env:GITHUB_OUTPUT
      - name: Generate REST client
        if: steps.specifications.outputs.changed == 'true'
        shell: pwsh
        run: ./scripts/Generate-Client.ps1
      - if: steps.specifications.outputs.changed == 'true'
        run: dotnet restore
      - if: steps.specifications.outputs.changed == 'true'
        run: dotnet build --no-restore --configuration Release
      - if: steps.specifications.outputs.changed == 'true'
        run: dotnet test --no-build --configuration Release
      - name: Open update pull request
        if: steps.specifications.outputs.changed == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          if git diff --quiet; then
            echo "No upstream changes."
            exit 0
          fi
          branch="automation/update-nova-api"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git checkout -B "$branch"
          git add specs src/Wandelbots.Nova.Api/Generated
          git commit -m "chore: update NOVA API specifications"
          git push --force-with-lease origin "$branch"
          gh pr create --base main --head "$branch" --title "chore: update NOVA API specifications" --body "Automated update from the public Wandelbots NOVA OpenAPI and AsyncAPI specifications." || true
